
name: Build Void Editor Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller faster-whisper

      - name: Build executable
        working-directory: dist
        run: |
          python -m PyInstaller --noconfirm --clean --distpath ../build-output --workpath ../build-temp VoidEditorTranscript.spec

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "build-output/VoidEditorTranscript.exe")) {
            throw "Executable was not generated."
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: VoidEditorTranscript-Windows
          path: build-output/VoidEditorTranscript.exe
          if-no-files-found: error
